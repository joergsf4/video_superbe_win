[package]
name = "video-superbe"
version = "1.1.4"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Foundation", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Media", "Win32_UI_Shell", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi"] }

[profile.release]
codegen-units = 1
panic = "abort"
opt-level = 3
lto = true
strip = true

[profile.dev]
panic = "abort"

[build-dependencies]
cc = "1.9.0"

